# Site settings
title: "QMSS 5070: GIS and Spatial Analysis"
description: "Geographic Information Systems and Spatial Analysis course at Columbia University"
url: "https://manasagnihotri.github.io"
baseurl: "/GIS-Course" # Required for project sites: https://username.github.io/GIS-Course/

# Build settings
markdown: kramdown
highlighter: rouge
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - README.md
  - PROFESSOR_DRIVE_CHECKLIST.md
  - GOOGLE_DRIVE_SETUP.md
  - slides
  - course_files

# Using custom layout in _layouts/ (no remote theme)

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
